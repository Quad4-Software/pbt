version: "3"

tasks:
  test:
    desc: Run all tests
    cmds:
      - go test ./...

  "test:leak":
    desc: Run goroutine leak-focused tests
    cmds:
      - go test ./... -run Leak -count=1

  "test:fuzz":
    desc: Run fuzz targets with bounded time
    cmds:
      - go test ./pkg/pbt -run '^$' -fuzz '^FuzzIntRangeWithinBounds$' -fuzztime=10s
      - go test ./pkg/pbt -run '^$' -fuzz '^FuzzStringASCIIContract$' -fuzztime=10s
      - go test ./pkg/pbt -run '^$' -fuzz '^FuzzCheckResultDeterministic$' -fuzztime=10s

  "test:all":
    desc: Run test, leak, and fuzz suites
    deps: [test, "test:leak", "test:fuzz"]

  "test:cov":
    desc: Run tests with coverage; fails if below 75%
    cmds:
      - go test ./... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out | awk '/total:/ { gsub(/%/, "", $$NF); if ($$NF + 0 < 75) { print "Coverage " $$NF "% is below 75%"; exit 1 } }'

  fmt:
    desc: Format all Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet checks
    cmds:
      - go vet ./...

  lint:
    desc: Run revive linter
    cmds:
      - revive -config revive.toml -formatter friendly ./cmd/... ./internal/... ./pkg/...

  ci:
    desc: Run local CI pipeline
    deps: [fmt, vet, lint, "test:all"]

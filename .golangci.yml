version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - "-SA1019"
        - "-QF1001"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
